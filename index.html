<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAL-61B / KTC-1400 DRYAD Simulator</title>
  <style>
    :root{--dark:#252b22;--mid:#3a4435;--paper:#f4eedc;--alt:#e6dec5;--ink:#1b1e19;--yellow:#f7d617;--mono:'Courier New',monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box}body{margin:0;padding:16px;background:#161a14;color:#e8ece6;font-family:var(--sans);min-height:100vh;display:flex;justify-content:center}
    .device-wrapper{width:100%;max-width:820px}.kal-case{background:linear-gradient(145deg,var(--mid),var(--dark));border:3px solid #0f120e;border-radius:12px;padding:12px 14px 14px;box-shadow:0 12px 30px #000a;margin-bottom:12px}
    .kal-stamping,.sheet-header,.sheet-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font:bold .72rem var(--mono)}
    .kal-stamping{color:#b4beac;border-bottom:2px solid #1e241b;padding-bottom:6px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px}
    .kal-window{background:var(--paper);color:var(--ink);border:3px solid #1c2019;border-radius:4px;padding:8px;box-shadow:inset 0 0 12px #0004;overflow:visible}.sheet-header{border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:6px;flex-wrap:wrap}
    .grid-stage{position:relative;width:100%;padding:12px 0 14px;overflow:visible}
    table.dryad-grid{width:100%;border-collapse:collapse;table-layout:fixed;font:clamp(.48rem,1.8vw,.84rem) var(--mono);user-select:none}
    col.col-row{width:5.5%}col.col-4{width:12.5%}col.col-3{width:10.2%}col.col-2{width:8.566%}
    th,td{border:1px solid #8a826e;text-align:center;padding:0;vertical-align:middle;overflow:hidden}tr.heading-row th{background:#d7ccb0;color:#111;padding:3px 1px;line-height:1.15}
    .hdr-digit{display:block;font-weight:900;border-bottom:1px solid #9d947e}.hdr-letters{display:flex;letter-spacing:0;padding-top:1px;color:#2b2922;white-space:nowrap}.hdr-letters span{flex:1;min-width:0;text-align:center}
    tr.cipher-row{height:28px;cursor:pointer}tr.cipher-row:nth-child(even) td{background:var(--alt)}tr.cipher-row:hover td{background:#ffe00029}tr.cipher-row td.row-label{font-weight:900;background:#dfd5ba;color:#111}
    .letter-group{display:flex;justify-content:space-around;align-items:center;width:100%;height:100%;padding:0 1px;font-weight:700;white-space:nowrap}.letter-group span{flex:1;min-width:0;text-align:center}
    .yellow-slider{position:absolute;left:0;right:0;width:100%;z-index:20;cursor:ns-resize;user-select:none;touch-action:none;display:flex;flex-direction:column;border-radius:4px;box-shadow:0 4px 12px #0007;transition:top .08s ease-out}
    .yellow-slider.dragging{transition:none}.slider-band{background:var(--yellow);color:#111;border:1.5px solid #9e8100;display:flex;align-items:center;width:100%;padding-inline:14px;font:900 .72rem var(--mono);overflow:visible}
    .top-band{height:24px;line-height:24px;border-bottom:2px solid #8a7000;border-radius:4px 4px 0 0;font-size:.82rem}.bottom-band{height:24px;line-height:24px;border-top:2px solid #8a7000;border-radius:0 0 4px 4px}
    .slider-window{height:28px;background:#ffe0003d;border-left:3px solid var(--yellow);border-right:3px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;pointer-events:none;color:#111}
    .slider-arrow{background:var(--yellow);color:#111;font-size:.72rem;font-weight:900;padding:0 3px;height:100%;display:flex;align-items:center}.slider-cell{text-align:center;border-right:1px solid #8a700073;height:100%;display:flex;align-items:center;justify-content:center;padding:0 1px;min-width:0;white-space:nowrap;color:#111}
    .sheet-footer{border-top:2px solid var(--ink);padding-top:4px;margin-top:4px;color:#3a372e;flex-wrap:wrap}.compact-panel{background:#21261e;border:1px solid #3c4637;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
    .top-bar,.compact-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top-bar{justify-content:space-between;border-bottom:1px solid #364031;padding-bottom:8px}.mode-tabs,.seed-box,.field-pair{display:flex;align-items:center;gap:5px}.seed-box label,.field-pair label{font-size:.72rem;font-weight:700;color:#aebaa6;text-transform:uppercase}
    button{background:#525e4b;color:#fff;border:1px solid #6c7b63;padding:5px 9px;border-radius:4px;font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap}button:hover{background:#62705a}button.active-tab{background:var(--yellow);color:#141712;border-color:#ffe853}button.danger{background:#7c2921;border-color:#a3392e}
    input[type=text],select{background:#141812;color:#f0f4ee;border:1px solid #4c5846;padding:4px 7px;border-radius:4px;font:.82rem var(--mono);text-transform:uppercase;max-width:100%}.readout-bar{background:#131711;border:1px solid #394234;border-left:4px solid var(--yellow);border-radius:4px;padding:7px 10px;font:.86rem var(--mono);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;flex:1;min-width:200px}.readout-val{color:var(--yellow);font-weight:900;font-size:.98rem;letter-spacing:1px}.hidden{display:none!important}
    @media(max-width:520px){body{padding:8px}.kal-case{padding:8px}.kal-window{padding:5px}.sheet-header,.sheet-footer{font-size:.58rem}.grid-stage{padding-top:12px;padding-bottom:12px}tr.cipher-row{height:25px}.slider-window{height:25px}.slider-cell{font-size:.62rem}.compact-panel{padding:8px}.readout-bar{min-width:100%}}
  </style>
</head>
<body>
<div class="device-wrapper">
  <div class="kal-case"><div class="kal-stamping"><span>HOLDER, CRYPTOGRAPHIC: KAL-61B</span><span>KTC-1400D DRYAD</span></div>
    <div class="kal-window"><div class="sheet-header"><span id="sheet-label">SHEET SEED: ALPHA7</span><span>DRAG YELLOW SLIDER OR CLICK ANY ROW</span></div>
      <div class="grid-stage" id="grid-stage"><table class="dryad-grid" id="dryad-table"><colgroup><col class="col-row"><col class="col-4"><col class="col-3"><col class="col-3"><col class="col-2"></colgroup><tbody id="dryad-body"></tbody></table>
        <div class="yellow-slider" id="yellow-slider"><div class="slider-band top-band" id="slider-top-band"></div><div class="slider-window" id="slider-window"></div><div class="slider-band bottom-band" id="slider-bottom-band"></div></div>
      </div><div class="sheet-footer"><span>KTC 1400D // NUMERAL CIPHER &amp; AUTHENTICATION</span><span>DESTROY AFTER CRYPTOPERIOD</span></div>
    </div>
  </div>
  <div class="compact-panel"><div class="top-bar"><div class="mode-tabs"><button id="tab-auth" class="active-tab">AUTHENTICATE</button><button id="tab-enc">CIPHER</button><button id="tab-dec">DECRYPT</button></div><div class="seed-box"><label for="seed-input">SEED:</label><input id="seed-input" type="text" value="ALPHA7" maxlength="14" style="width:96px"><button id="btn-apply-seed">LOAD</button><button id="btn-rand-seed" class="danger">NEW</button></div></div>
    <div id="view-auth" class="compact-row"><div class="field-pair"><label for="auth-row">ROW:</label><select id="auth-row"></select></div><div class="field-pair"><label for="auth-col">LETTER:</label><select id="auth-col"></select></div><button id="btn-rand-challenge">RANDOM</button><div class="readout-bar"><div>CHALLENGE: <span class="readout-val" id="out-challenge"></span></div><div>RESPONSE: <span class="readout-val" id="out-response"></span></div></div></div>
    <div id="view-enc" class="compact-row hidden"><div class="field-pair"><label for="enc-row">ROW:</label><select id="enc-row"></select></div><div class="field-pair"><label for="enc-col">COL:</label><select id="enc-col"></select></div><div class="field-pair"><label for="enc-digits">DIGITS:</label><input id="enc-digits" type="text" value="482915" maxlength="16" style="width:110px"></div><div class="readout-bar">CIPHERTEXT: <span class="readout-val" id="out-ciphertext"></span></div></div>
    <div id="view-dec" class="compact-row hidden"><div class="field-pair"><label for="dec-cipher">CIPHERTEXT:</label><input id="dec-cipher" type="text" placeholder="AK XQPMRT" maxlength="24" style="width:150px"></div><div class="field-pair"><label for="dec-row">OVERRIDE ROW:</label><select id="dec-row"><option value="AUTO">AUTO (2-LTR KEY)</option></select></div><div class="readout-bar">PLAINTEXT: <span class="readout-val" id="out-plaintext">---</span></div></div>
  </div>
</div>
<script>
const ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXY'.split(''),COL_SIZES=[4,3,3,2,2,3,2,2,2,2],HEADERS_EVERY=5;
let sheetData=[],activeRowIndex=0,isDragging=false,dragStartY=0,sliderStartTop=0;
const el=id=>document.getElementById(id);
function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function makeRng(s){let a=hashSeed(s||'DEFAULT');return()=>{let t=a+=0x6d2b79f5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a,rng){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildBands(){
  const top=el('slider-top-band'),bottom=el('slider-bottom-band');top.innerHTML='';bottom.innerHTML='';
  const topRow=document.createElement('div');topRow.className='slider-cell';topRow.style.width='5.5%';topRow.textContent='ROW';top.appendChild(topRow);
  const bottomRow=document.createElement('div');bottomRow.className='slider-cell';bottomRow.style.width='5.5%';bottomRow.textContent='SET';bottom.appendChild(bottomRow);
  const widths=[12.5,10.2,10.2,8.566,8.566,10.2,8.566,8.566,8.566,8.566];
  const headerLetters=[['A','B','C','D'],['E','F','G'],['H','J','K'],['L','M'],['N','P'],['Q','R','S'],['T','U'],['V','W'],['X','Y'],['Z','']];
  widths.forEach((width,index)=>{
    const topCell=document.createElement('div');topCell.className='slider-cell';topCell.style.width=width+'%';topCell.textContent=String(index);top.appendChild(topCell);
    const bottomCell=document.createElement('div');bottomCell.className='slider-cell';bottomCell.style.width=width+'%';headerLetters[index].forEach(letter=>{const span=document.createElement('span');span.className='slot';span.innerHTML=letter||'&nbsp;';bottomCell.appendChild(span)});bottom.appendChild(bottomCell);
  });
}
function generateSheet(){const seed=el('seed-input').value.trim().toUpperCase()||'ALPHA7';el('seed-input').value=seed;el('sheet-label').textContent=`SHEET SEED: ${seed}`;const rng=makeRng(seed);sheetData=ALPHABET.map(rowLetter=>{const flat=shuffle(ALPHABET,rng),cols=[];let offset=0;COL_SIZES.forEach(size=>{cols.push(flat.slice(offset,offset+size));offset+=size});return{rowLetter,cols}});renderTable();positionSliderToRow(activeRowIndex)}
function renderTable(){const body=el('dryad-body');body.innerHTML='';sheetData.forEach((row,index)=>{if(index%HEADERS_EVERY===0){const tr=document.createElement('tr');tr.className='heading-row';const th=document.createElement('th');th.innerHTML='<span class="hdr-digit">&nbsp;</span><span>ROW</span>';tr.appendChild(th);COL_SIZES.forEach((size,i)=>{const h=document.createElement('th');h.innerHTML=`<span class="hdr-digit">${i}</span>`;tr.appendChild(h)});body.appendChild(tr)}const tr=document.createElement('tr');tr.className='cipher-row';tr.dataset.rowIndex=index;tr.onclick=()=>selectRow(index);const label=document.createElement('td');label.className='row-label';label.textContent=row.rowLetter;tr.appendChild(label);row.cols.forEach(group=>{const td=document.createElement('td');const div=document.createElement('div');div.className='letter-group';group.forEach(letter=>{const span=document.createElement('span');span.textContent=letter;div.appendChild(span)});td.appendChild(div);tr.appendChild(td)});body.appendChild(tr)})}
function positionSliderToRow(index){if(!sheetData.length)return;activeRowIndex=((index%sheetData.length)+sheetData.length)%sheetData.length;const stage=el('grid-stage'),slider=el('yellow-slider'),row=document.querySelector(`tr.cipher-row[data-row-index="${activeRowIndex}"]`);if(!row)return;const stageRect=stage.getBoundingClientRect(),rowRect=row.getBoundingClientRect(),sliderHeight=slider.offsetHeight||76;const desired=rowRect.top-stageRect.top+(rowRect.height-sliderHeight)/2;const max=Math.max(0,stageRect.height-sliderHeight);slider.style.top=`${Math.max(0,Math.min(max,desired))}px`}
function selectRow(index){const letter=ALPHABET[index];positionSliderToRow(index);if(!el('view-auth').classList.contains('hidden')){el('auth-row').value=letter;updateAuth()}else if(!el('view-enc').classList.contains('hidden')){el('enc-row').value=letter;updateEncrypt()}else{el('dec-row').value=letter;updateDecrypt()}}
function resolve(rowLetter,colLetter){const rowIndex=ALPHABET.indexOf(rowLetter),row=sheetData[rowIndex];for(let col=0;col<row.cols.length;col++){const slot=row.cols[col].indexOf(colLetter);if(slot!==-1)return{target:sheetData[(rowIndex+1)%ALPHABET.length].cols[col][slot]}}return{target:'--'}}
function updateAuth(){const row=el('auth-row').value,col=el('auth-col').value;if(!row||!col)return;positionSliderToRow(ALPHABET.indexOf(row));el('out-challenge').textContent=`${row} ${col}`;el('out-response').textContent=resolve(row,col).target}
function updateEncrypt(){const rowLetter=el('enc-row').value,colLetter=el('enc-col').value;if(!rowLetter||!colLetter)return;const target=resolve(rowLetter,colLetter).target,idx=ALPHABET.indexOf(target);positionSliderToRow(idx);const digits=el('enc-digits').value.replace(/[^0-9]/g,'');let cipher=rowLetter+colLetter;if(digits)cipher+=' '+digits.split('').map((d,i)=>sheetData[idx].cols[Number(d)%sheetData[idx].cols.length][i%sheetData[idx].cols[Number(d)%sheetData[idx].cols.length].length]).join('');el('out-ciphertext').textContent=cipher}
function updateDecrypt(){const raw=[...el('dec-cipher').value.toUpperCase()].filter(letter=>ALPHABET.includes(letter)).join(''),override=el('dec-row').value;if(!raw){el('out-plaintext').textContent='---';return}let payload=raw,rowIndex;if(override==='AUTO'){if(raw.length<2){el('out-plaintext').textContent='NEED 2-LTR KEY';return}rowIndex=ALPHABET.indexOf(resolve(raw[0],raw[1]).target);payload=raw.slice(2)}else rowIndex=ALPHABET.indexOf(override);positionSliderToRow(rowIndex);el('out-plaintext').textContent='---'}
function switchMode(mode){['auth','enc','dec'].forEach(name=>{el(`view-${name}`).classList.toggle('hidden',name!==mode);el(`tab-${name}`).classList.toggle('active-tab',name===mode)});if(mode==='auth')updateAuth();if(mode==='enc')updateEncrypt();if(mode==='dec')updateDecrypt()}
['auth-row','auth-col','enc-row','enc-col'].forEach(id=>ALPHABET.forEach(letter=>el(id).appendChild(new Option(letter,letter))));ALPHABET.forEach(letter=>el('dec-row').appendChild(new Option(letter,letter)));el('auth-col').value=el('enc-col').value='K';el('auth-row').value=el('enc-row').value='A';
el('tab-auth').onclick=()=>switchMode('auth');el('tab-enc').onclick=()=>switchMode('enc');el('tab-dec').onclick=()=>switchMode('dec');el('btn-apply-seed').onclick=generateSheet;el('seed-input').onkeydown=e=>{if(e.key==='Enter')generateSheet()};el('btn-rand-seed').onclick=()=>{el('seed-input').value=['BRAVO','DELTA','SIERRA','TANGO','VICTOR','YANKEE'][Math.random()*6|0]+(10+Math.random()*89|0);generateSheet()};
el('auth-row').onchange=updateAuth;el('auth-col').onchange=updateAuth;el('btn-rand-challenge').onclick=()=>{el('auth-row').value=ALPHABET[Math.random()*ALPHABET.length|0];el('auth-col').value=ALPHABET[Math.random()*ALPHABET.length|0];updateAuth()};el('enc-row').onchange=updateEncrypt;el('enc-col').onchange=updateEncrypt;el('enc-digits').oninput=updateEncrypt;el('dec-cipher').oninput=updateDecrypt;el('dec-row').onchange=updateDecrypt;window.onresize=()=>positionSliderToRow(activeRowIndex);
const slider=el('yellow-slider'),stage=el('grid-stage');slider.addEventListener('pointerdown',event=>{isDragging=true;dragStartY=event.clientY;sliderStartTop=parseFloat(slider.style.top||'0');slider.classList.add('dragging');slider.setPointerCapture(event.pointerId)});slider.addEventListener('pointermove',event=>{if(!isDragging)return;const stageRect=stage.getBoundingClientRect(),sliderHeight=slider.offsetHeight||76,top=Math.max(0,Math.min(stageRect.height-sliderHeight,sliderStartTop+event.clientY-dragStartY));slider.style.top=`${top}px`;let nearest=activeRowIndex,distance=Infinity;document.querySelectorAll('tr.cipher-row').forEach(row=>{const rect=row.getBoundingClientRect(),delta=Math.abs(stageRect.top+top+sliderHeight/2-(rect.top+rect.height/2));if(delta<distance){distance=delta;nearest=Number(row.dataset.rowIndex)}});if(nearest!==activeRowIndex){activeRowIndex=nearest;const letter=ALPHABET[nearest];if(!el('view-auth').classList.contains('hidden')){el('auth-row').value=letter;updateAuth()}else if(!el('view-enc').classList.contains('hidden')){el('enc-row').value=letter;updateEncrypt()}else{el('dec-row').value=letter;updateDecrypt()}}});const endDrag=event=>{if(!isDragging)return;isDragging=false;slider.classList.remove('dragging');if(slider.hasPointerCapture(event.pointerId))slider.releasePointerCapture(event.pointerId);positionSliderToRow(activeRowIndex)};slider.addEventListener('pointerup',endDrag);slider.addEventListener('pointercancel',endDrag);
buildBands();generateSheet();updateAuth();
</script>
</body>
</html>
