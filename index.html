<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAL-61B / KTC-1400 DRYAD Simulator</title>
  <style>
    :root{--dark:#252b22;--mid:#3a4435;--paper:#f4eedc;--alt:#e6dec5;--ink:#1b1e19;--yellow:#f7d617;--mono:'Courier New',monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box} body{margin:0;padding:16px;background:#161a14;color:#e8ece6;font-family:var(--sans);min-height:100vh;display:flex;justify-content:center}
    .device-wrapper{width:100%;max-width:820px}.kal-case{background:linear-gradient(145deg,#3a4435,var(--dark));border:3px solid #0f120e;border-radius:12px;padding:12px 14px 14px;box-shadow:0 12px 30px #000a;margin-bottom:12px}
    .kal-stamping,.sheet-header,.sheet-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font: bold .72rem var(--mono)}.kal-stamping{color:#b4beac;border-bottom:2px solid #1e241b;padding-bottom:6px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.8px}
    .kal-window{background:var(--paper);color:var(--ink);border:3px solid #1c2019;border-radius:4px;padding:8px;box-shadow:inset 0 0 12px #0004;overflow:visible}.sheet-header{border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:6px;flex-wrap:wrap}
    .grid-stage{position:relative;width:100%;padding:26px 0 28px}table.dryad-grid{width:100%;border-collapse:collapse;table-layout:fixed;font:clamp(.48rem,1.8vw,.84rem) var(--mono);user-select:none}
    col.col-row{width:5.5%}col.col-4{width:12.5%}col.col-3{width:10.2%}col.col-2{width:8.566%}
    th,td{border:1px solid #8a826e;text-align:center;padding:0;vertical-align:middle;overflow:hidden}tr.heading-row th{background:#d7ccb0;color:#111;padding:3px 1px;line-height:1.15}.hdr-digit{display:block;font-weight:900;border-bottom:1px solid #9d947e}.hdr-letters{display:block;font-size:clamp(.4rem,1.35vw,.68rem);letter-spacing:.04em;padding-top:1px;color:#2b2922;white-space:nowrap}
    tr.cipher-row{height:28px;cursor:pointer}tr.cipher-row:nth-child(even) td{background:var(--alt)}tr.cipher-row:hover td{background:#ffe00029}tr.cipher-row td.row-label{font-weight:900;background:#dfd5ba;color:#111}.letter-group{display:flex;justify-content:space-around;align-items:center;width:100%;height:100%;padding:0 1px;font-weight:700;letter-spacing:0;white-space:nowrap}
    /* The slider overhangs the sheet, while its padded cell area remains aligned to the grid. */
    .yellow-slider{position:absolute;left:-14px;right:-14px;z-index:20;cursor:ns-resize;user-select:none;touch-action:none;display:flex;flex-direction:column;border-radius:4px;box-shadow:0 4px 12px #0007;transition:top .08s ease-out}.yellow-slider.dragging{transition:none}
    .slider-band{background:var(--yellow);color:#111;border:1.5px solid #9e8100;display:flex;align-items:center;width:100%;padding-inline:14px;font:900 .72rem var(--mono);overflow:visible}.top-band{height:24px;line-height:24px;border-bottom:2px solid #8a7000;border-radius:4px 4px 0 0;font-size:.82rem}.bottom-band{height:24px;line-height:24px;border-top:2px solid #8a7000;border-radius:0 0 4px 4px}.slider-window{height:28px;background:#ffe0003d;border-left:3px solid var(--yellow);border-right:3px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;pointer-events:none}.slider-arrow{background:var(--yellow);color:#111;font-size:.72rem;font-weight:900;padding:0 3px;height:100%;display:flex;align-items:center}.slider-cell{text-align:center;border-right:1px solid #8a700073;height:100%;display:flex;align-items:center;justify-content:space-around;padding:0 1px;min-width:0;white-space:nowrap}.slider-cell:last-child{border:0}.sheet-footer{border-top:2px solid var(--ink);padding-top:4px;margin-top:4px;color:#3a372e;flex-wrap:wrap}
    .compact-panel{background:#21261e;border:1px solid #3c4637;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.top-bar,.compact-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top-bar{justify-content:space-between;border-bottom:1px solid #364031;padding-bottom:8px}.mode-tabs,.seed-box,.field-pair{display:flex;align-items:center;gap:5px}.seed-box label,.field-pair label{font-size:.72rem;font-weight:700;color:#aebaa6;text-transform:uppercase}button{background:#525e4b;color:#fff;border:1px solid #6c7b63;padding:5px 9px;border-radius:4px;font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap}button:hover{background:#62705a}button.active-tab{background:var(--yellow);color:#141712;border-color:#ffe853}button.danger{background:#7c2921;border-color:#a3392e}input[type=text],select{background:#141812;color:#f0f4ee;border:1px solid #4c5846;padding:4px 7px;border-radius:4px;font: .82rem var(--mono);text-transform:uppercase;max-width:100%}.readout-bar{background:#131711;border:1px solid #394234;border-left:4px solid var(--yellow);border-radius:4px;padding:7px 10px;font:.86rem var(--mono);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;flex:1;min-width:200px}.readout-val{color:var(--yellow);font-weight:900;font-size:.98rem;letter-spacing:1px}.hidden{display:none!important}
    @media(max-width:520px){body{padding:8px}.kal-case{padding:8px}.kal-window{padding:5px}.sheet-header,.sheet-footer{font-size:.58rem}.grid-stage{padding-top:24px;padding-bottom:24px}tr.cipher-row{height:25px}.slider-window{height:25px}.slider-band{padding-inline:10px}.yellow-slider{left:-10px;right:-10px}.slider-cell{padding:0;font-size:.62rem}.compact-panel{padding:8px}.readout-bar{min-width:100%}}
  </style>
</head>
<body>
<div class="device-wrapper">
  <div class="kal-case"><div class="kal-stamping"><span>HOLDER, CRYPTOGRAPHIC: KAL-61B</span><span>KTC-1400D DRYAD</span></div>
    <div class="kal-window"><div class="sheet-header"><span id="sheet-label">SHEET SEED: ALPHA7</span><span>DRAG YELLOW SLIDER OR CLICK ANY ROW</span></div>
      <div class="grid-stage" id="grid-stage"><table class="dryad-grid"><colgroup><col class="col-row"><col class="col-4"><col class="col-3"><col class="col-3"><col class="col-2"><col class="col-2"><col class="col-3"><col class="col-2"><col class="col-2"><col class="col-2"><col class="col-2"></colgroup><tbody id="dryad-body"></tbody></table>
        <div class="yellow-slider" id="yellow-slider"><div class="slider-band top-band" id="slider-top-band"></div><div class="slider-window" id="slider-window"><span class="slider-arrow">▶</span><span class="slider-arrow">◀</span></div><div class="slider-band bottom-band" id="slider-bottom-band"></div></div>
      </div><div class="sheet-footer"><span>KTC 1400D // NUMERAL CIPHER &amp; AUTHENTICATION</span><span>DESTROY AFTER CRYPTOPERIOD</span></div>
    </div>
  </div>
  <div class="compact-panel"><div class="top-bar"><div class="mode-tabs"><button id="tab-auth" class="active-tab">AUTHENTICATE</button><button id="tab-enc">CIPHER</button><button id="tab-dec">DECRYPT</button></div><div class="seed-box"><label for="seed-input">SEED:</label><input id="seed-input" type="text" value="ALPHA7" maxlength="14" style="width:96px"><button id="btn-apply-seed">LOAD</button><button id="btn-rand-seed" class="danger">NEW</button></div></div>
    <div id="view-auth" class="compact-row"><div class="compact-row"><div class="field-pair"><label for="auth-row">ROW:</label><select id="auth-row"></select></div><div class="field-pair"><label for="auth-col">LETTER:</label><select id="auth-col"></select></div><button id="btn-rand-challenge">RANDOM</button></div><div class="readout-bar"><div>CHALLENGE: <span class="readout-val" id="out-challenge"></span></div><div>RESPONSE: <span class="readout-val" id="out-response"></span></div></div></div>
    <div id="view-enc" class="compact-row hidden"><div class="compact-row"><div class="field-pair"><label for="enc-row">ROW:</label><select id="enc-row"></select></div><div class="field-pair"><label for="enc-col">COL:</label><select id="enc-col"></select></div><div class="field-pair"><label for="enc-digits">DIGITS:</label><input id="enc-digits" type="text" value="482915" maxlength="16" style="width:110px"></div></div><div class="readout-bar">CIPHERTEXT: <span class="readout-val" id="out-ciphertext"></span></div></div>
    <div id="view-dec" class="compact-row hidden"><div class="compact-row"><div class="field-pair"><label for="dec-cipher">CIPHERTEXT:</label><input id="dec-cipher" type="text" placeholder="AK XQPMRT" maxlength="24" style="width:150px"></div><div class="field-pair"><label for="dec-row">OVERRIDE ROW:</label><select id="dec-row"><option value="AUTO">AUTO (2-LTR KEY)</option></select></div></div><div class="readout-bar">PLAINTEXT: <span class="readout-val" id="out-plaintext">---</span></div></div>
  </div>
</div>
<script>
  const ALPHABET="ABCDEFGHIJKLMNOPQRSTUVWXY".split(""),COL_SIZES=[4,3,3,2,2,3,2,2,2,2],COL_WIDTHS=[5.5,12.5,10.2,10.2,8.566,8.566,10.2,8.566,8.566,8.566,8.566],HEADER_LETTERS=["ABCD","EFG","HIJ","KL","MN","OPQ","RS","TU","VW","XY"].map(x=>x.split(""));
  let sheetData=[],activeRowIndex=0,isDragging=false,dragStartY=0,sliderStartTop=0;
  function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function makeRng(s){let a=hashSeed(s||"DEFAULT");return()=>{let t=a+=0x6d2b79f5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
  function shuffle(a,rng){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function buildBands(){for(const id of ["slider-top-band","slider-bottom-band"]){const el=document.getElementById(id);el.innerHTML="";const spacer=document.createElement("div");spacer.className="slider-cell";spacer.style.width=COL_WIDTHS[0]+"%";spacer.textContent=id.includes("top")?"ROW":"SET";el.appendChild(spacer);for(let c=0;c<10;c++){const cell=document.createElement("div");cell.className="slider-cell";cell.style.width=COL_WIDTHS[c+1]+"%";if(id.includes("top"))cell.textContent=c;else HEADER_LETTERS[c].forEach(ch=>{const s=document.createElement("span");s.textContent=ch;cell.appendChild(s)});el.appendChild(cell)}}}
  function heading(){const tr=document.createElement("tr");tr.className="heading-row";const th=document.createElement("th");th.innerHTML='<span class="hdr-digit">&nbsp;</span><span class="hdr-letters">ROW</span>';tr.appendChild(th);HEADER_LETTERS.forEach((g,c)=>{const h=document.createElement("th");h.innerHTML=`<span class="hdr-digit">${c}</span><span class="hdr-letters">${g.join(" ")}</span>`;tr.appendChild(h)});return tr}
  function generateSheet(){const seed=document.getElementById("seed-input").value.trim().toUpperCase()||"ALPHA7";document.getElementById("seed-input").value=seed;document.getElementById("sheet-label").textContent=`SHEET SEED: ${seed}`;const rng=makeRng(seed);sheetData=ALPHABET.map(rowLetter=>{const flat=shuffle(ALPHABET,rng),cols=[];let i=0;COL_SIZES.forEach(n=>{cols.push(flat.slice(i,i+n));i+=n});return{rowLetter,cols}});renderTable();positionSliderToRow(activeRowIndex);updateAuth();updateEncrypt();updateDecrypt()}
  function renderTable(){const body=document.getElementById("dryad-body");body.innerHTML="";sheetData.forEach((row,r)=>{if(r%5===0)body.appendChild(heading());const tr=document.createElement("tr");tr.className="cipher-row";tr.dataset.rowIndex=r;tr.addEventListener("click",()=>selectRow(r));const label=document.createElement("td");label.className="row-label";label.textContent=row.rowLetter;tr.appendChild(label);row.cols.forEach(group=>{const td=document.createElement("td"),d=document.createElement("div");d.className="letter-group";group.forEach(ch=>{const s=document.createElement("span");s.textContent=ch;d.appendChild(s)});td.appendChild(d);tr.appendChild(td)});body.appendChild(tr)})}
  function positionSliderToRow(i){activeRowIndex=(i%25+25)%25;const stage=document.getElementById("grid-stage"),slider=document.getElementById("yellow-slider"),row=document.querySelector(`tr.cipher-row[data-row-index="${activeRowIndex}"]`);if(!row)return;slider.style.top=`${row.getBoundingClientRect().top-stage.getBoundingClientRect().top-24}px`;document.getElementById("slider-window").style.height=row.getBoundingClientRect().height+"px"}
  function selectRow(i){const letter=ALPHABET[(i%25+25)%25];positionSliderToRow(i);if(!viewAuth.classList.contains("hidden")){authRow.value=letter;updateAuth()}else if(!viewEnc.classList.contains("hidden")){encRow.value=letter;updateEncrypt()}else{decRow.value=letter;updateDecrypt()}}
  function resolve(row,col){const r=ALPHABET.indexOf(row),obj=sheetData[r];let c=0,s=0;obj.cols.forEach((g,i)=>{const p=g.indexOf(col);if(p>=0){c=i;s=p}});const target=sheetData[(r+1)%25].cols[c][s];return{target}}
  const el=id=>document.getElementById(id),viewAuth=el("view-auth"),viewEnc=el("view-enc"),viewDec=el("view-dec"),authRow=el("auth-row"),encRow=el("enc-row"),decRow=el("dec-row");
  function updateAuth(){const r=authRow.value,c=el("auth-col").value;if(!r||!c)return;positionSliderToRow(ALPHABET.indexOf(r));el("out-challenge").textContent=`${r} ${c}`;el("out-response").textContent=resolve(r,c).target;encRow.value=r;el("enc-col").value=c}
  function updateEncrypt(){const r=encRow.value,c=el("enc-col").value;if(!r||!c)return;const rowIdx=ALPHABET.indexOf(resolve(r,c).target),row=sheetData[rowIdx],counts=Array(10).fill(0),digits=el("enc-digits").value.replace(/[^0-9]/g,"");if(!viewEnc.classList.contains("hidden"))positionSliderToRow(rowIdx);const out=[...digits].map(ch=>{const d=+ch,p=row.cols[d];return p[counts[d]++%p.length]}).join("");el("out-ciphertext").textContent=`${r}${c}${out?" "+out:""}`}
  function updateDecrypt(){const raw=el("dec-cipher").value.toUpperCase().replace(/[^A-Y]/g,""),override=decRow.value;if(!raw){el("out-plaintext").textContent="---";return}let idx,payload=raw;if(override==="AUTO"){if(raw.length<2){el("out-plaintext").textContent="NEED 2-LTR KEY";return}idx=ALPHABET.indexOf(resolve(raw[0],raw[1]).target);payload=raw.slice(2)}else idx=ALPHABET.indexOf(override);if(!viewDec.classList.contains("hidden"))positionSliderToRow(idx);const out=[...payload].map(ch=>{const found=sheetData[idx].cols.findIndex(g=>g.includes(ch));return found<0?"":found}).join("");el("out-plaintext").textContent=out||"---"}
  function switchMode(mode){["auth","enc","dec"].forEach(m=>{el(`view-${m}`).classList.toggle("hidden",m!==mode);el(`tab-${m}`).classList.toggle("active-tab",m===mode)});if(mode==="auth")updateAuth();else if(mode==="enc")updateEncrypt();else{if(!el("dec-cipher").value.trim())el("dec-cipher").value=el("out-ciphertext").textContent;updateDecrypt()}}
  ["auth-row","auth-col","enc-row","enc-col","dec-row"].forEach(id=>ALPHABET.forEach(ch=>{const o=document.createElement("option");o.value=o.textContent=ch;el(id).appendChild(o)}));el("dec-row").insertBefore(new Option("AUTO (2-LTR KEY)","AUTO"),el("dec-row").firstChild);el("auth-col").value=el("enc-col").value="K";
  el("tab-auth").onclick=()=>switchMode("auth");el("tab-enc").onclick=()=>switchMode("enc");el("tab-dec").onclick=()=>switchMode("dec");el("btn-apply-seed").onclick=generateSheet;el("seed-input").onkeydown=e=>{if(e.key==="Enter")generateSheet()};el("btn-rand-seed").onclick=()=>{const words=["BRAVO","DELTA","SIERRA","TANGO","VICTOR","YANKEE","KILO","OSCAR"];el("seed-input").value=words[Math.random()*words.length|0]+(10+Math.random()*89|0);generateSheet()};
  authRow.onchange=updateAuth;el("auth-col").onchange=updateAuth;el("btn-rand-challenge").onclick=()=>{authRow.value=ALPHABET[Math.random()*25|0];el("auth-col").value=ALPHABET[Math.random()*25|0];updateAuth()};encRow.onchange=el("enc-col").onchange=updateEncrypt;el("enc-digits").oninput=updateEncrypt;el("dec-cipher").oninput=updateDecrypt;decRow.onchange=updateDecrypt;window.onresize=()=>positionSliderToRow(activeRowIndex);
  const slider=el("yellow-slider"),stage=el("grid-stage");slider.addEventListener("pointerdown",e=>{isDragging=true;dragStartY=e.clientY;sliderStartTop=parseFloat(slider.style.top||"0");slider.classList.add("dragging");slider.setPointerCapture(e.pointerId)});slider.addEventListener("pointermove",e=>{if(!isDragging)return;const top=sliderStartTop+e.clientY-dragStartY;slider.style.top=top+"px";const center=stage.getBoundingClientRect().top+top+24+14;let best=activeRowIndex,dist=Infinity;document.querySelectorAll("tr.cipher-row").forEach(row=>{const r=row.getBoundingClientRect(),d=Math.abs(center-(r.top+r.bottom)/2);if(d<dist){dist=d;best=+row.dataset.rowIndex}});if(best!==activeRowIndex){activeRowIndex=best;const l=ALPHABET[best];if(!viewAuth.classList.contains("hidden")){authRow.value=l;const c=el("auth-col").value;el("out-challenge").textContent=`${l} ${c}`;el("out-response").textContent=resolve(l,c).target;encRow.value=l}else if(!viewEnc.classList.contains("hidden"))encRow.value=l;else decRow.value=l}});const end=e=>{if(!isDragging)return;isDragging=false;slider.classList.remove("dragging");if(slider.hasPointerCapture(e.pointerId))slider.releasePointerCapture(e.pointerId);selectRow(activeRowIndex)};slider.addEventListener("pointerup",end);slider.addEventListener("pointercancel",end);
  buildBands();generateSheet();
</script>
</body>
</html>
