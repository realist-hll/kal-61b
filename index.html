<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAL-61B / KTC-1400 DRYAD Simulator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script src="letter-encryption.js" defer></script>
</head>
<body>
  <div class="device-wrapper">
    <div class="kal-case">
      <div class="kal-stamping">
        <span>HOLDER, CRYPTOGRAPHIC: KAL-61B</span>
        <span>KTC-1400D DRYAD</span>
      </div>
      <div class="kal-window">
        <div class="sheet-header">
          <span id="sheet-label">SHEET SEED: ALPHA7</span>
          <span>DRAG YELLOW SLIDER OR CLICK ANY ROW</span>
        </div>
        <div class="grid-stage" id="grid-stage">
          <table class="dryad-grid" id="dryad-table">
            <colgroup>
              <col class="col-row">
              <col class="col-4">
              <col class="col-3">
              <col class="col-3">
              <col class="col-2">
              <col class="col-2">
              <col class="col-3">
              <col class="col-2">
              <col class="col-2">
              <col class="col-2">
              <col class="col-2">
            </colgroup>
            <tbody id="dryad-body"></tbody>
          </table>
          <div class="yellow-slider" id="yellow-slider">
            <div class="slider-band top-band" id="slider-top-band"></div>
            <div class="slider-window" id="slider-window">
              <span class="slider-arrow">▶</span>
              <span class="slider-arrow">◀</span>
            </div>
            <div class="slider-band bottom-band" id="slider-bottom-band"></div>
          </div>
        </div>
        <div class="sheet-footer">
          <span>KTC 1400D // NUMERAL CIPHER &amp; AUTHENTICATION</span>
          <span>DESTROY AFTER CRYPTOPERIOD</span>
        </div>
      </div>
    </div>

    <div class="compact-panel">
      <div class="top-bar">
        <div class="mode-tabs">
          <button id="tab-auth" class="active-tab">AUTHENTICATE</button>
          <button id="tab-enc">CIPHER</button>
          <button id="tab-dec">DECRYPT</button>
        </div>
        <div class="seed-box">
          <label for="seed-input">SEED:</label>
          <input id="seed-input" type="text" value="ALPHA7" maxlength="14" style="width:96px">
          <button id="btn-apply-seed">LOAD</button>
          <button id="btn-rand-seed" class="danger">NEW</button>
        </div>
      </div>
      <div id="view-auth" class="compact-row">
        <div class="field-pair">
          <label for="auth-row">ROW:</label>
          <select id="auth-row"></select>
        </div>
        <div class="field-pair">
          <label for="auth-col">LETTER:</label>
          <select id="auth-col"></select>
        </div>
        <button id="btn-rand-challenge">RANDOM</button>
        <div class="readout-bar">
          <div>CHALLENGE: <span class="readout-val" id="out-challenge"></span></div>
          <div>RESPONSE: <span class="readout-val" id="out-response"></span></div>
        </div>
      </div>
      <div id="view-enc" class="compact-row hidden">
        <div class="field-pair">
          <label for="enc-row">ROW:</label>
          <select id="enc-row"></select>
        </div>
        <div class="field-pair">
          <label for="enc-col">COL:</label>
          <select id="enc-col"></select>
        </div>
        <div class="field-pair">
          <label for="enc-digits">DIGITS:</label>
          <input id="enc-digits" type="text" value="482915" maxlength="16" style="width:110px">
        </div>
        <div class="field-pair">
          <label for="enc-letters">LETTERS:</label>
          <input id="enc-letters" type="text" placeholder="HELLO" maxlength="24" style="width:110px">
        </div>
        <div class="readout-bar">
          CIPHERTEXT: <span class="readout-val" id="out-ciphertext"></span>
        </div>
      </div>
      <div id="view-dec" class="compact-row hidden">
        <div class="field-pair">
          <label for="dec-cipher">CIPHERTEXT:</label>
          <input id="dec-cipher" type="text" placeholder="AK XQPMRT" maxlength="24" style="width:150px">
        </div>
        <div class="field-pair">
          <label for="dec-row">OVERRIDE ROW:</label>
          <select id="dec-row">
            <option value="AUTO">AUTO (2-LTR KEY)</option>
          </select>
        </div>
        <div class="readout-bar">
          PLAINTEXT: <span class="readout-val" id="out-plaintext">---</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
