<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KTC-600 &amp; KAL-61 (KTC-1400) Multi-Day Pocket Sheet Generator</title>
<style>
  @page { size: A5 portrait; margin: 7mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Courier New", Courier, monospace;
    background-color: #e9ecef;
    color: #111;
    font-size: 7.2pt;
    -webkit-text-size-adjust: 100%;
  }
  .controls {
    background: #1f2937; color: #fff; padding: 12px 20px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    justify-content: center; font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .controls label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .controls input {
    width: 75px; padding: 5px 8px; border-radius: 4px;
    border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 13px;
  }
  .controls button {
    padding: 6px 14px; border: none; border-radius: 4px;
    font-weight: 600; cursor: pointer; font-size: 13px;
  }
  .btn-gen { background: #2563eb; color: #fff; }
  .btn-gen:hover { background: #1d4ed8; }
  .btn-print { background: #10b981; color: #fff; }
  .btn-print:hover { background: #059669; }
  #sheets-container {
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 10px; gap: 16px;
  }
  .page {
    width: min(100%, 148mm); min-height: 210mm; padding: 7mm; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18); page-break-after: always;
    break-after: page; display: flex; flex-direction: column; justify-content: space-between;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  @media screen and (max-width: 600px) {
    body { font-size: 12px; }
    #sheets-container { padding: 10px 8px; gap: 12px; }
    .page { width: 100%; min-height: 0; padding: 12px; }
    .header { align-items: flex-start; flex-wrap: wrap; }
    .title { font-size: 0.95rem; }
    .meta { font-size: 0.75rem; text-align: left; }
    .cat-header { font-size: 0.8rem; }
    td, th {
      padding: 3px 4px;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .kal-table th, .kal-table td {
      padding: 3px 0;
      font-size: clamp(8px, 2.2vw, 11px);
    }
    .notes { font-size: 0.75rem; }
    .radio-channels { font-size: 0.7rem; }
  }
  @media print {
    body { background: #fff; }
    .controls { display: none !important; }
    #sheets-container { padding: 0; gap: 0; display: block; }
    .page {
      width: 100%; height: 196mm; min-height: 196mm; max-height: 196mm;
      padding: 0; box-shadow: none;
    }
  }
  .header {
    border-bottom: 1.5px solid #000; padding-bottom: 2px; margin-bottom: 3px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 4px;
  }
  .title { font-weight: bold; font-size: 8.8pt; letter-spacing: 0.2px; }
  .meta { font-size: 6.8pt; font-weight: bold; text-align: right; }
  .cat-header {
    background-color: #222; color: #fff; font-weight: bold; font-size: 6.6pt;
    padding: 1.5px 4px; margin-top: 3px;
  }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; }
  td, th { border: 0.5px solid #888; padding: 1.2px 3px; overflow: hidden; white-space: nowrap; }
  th { background-color: #e5e5e5; font-weight: bold; }
  td.w, th.w { width: 36%; text-align: left; }
  td.c, th.c { width: 14%; text-align: center; font-weight: bold; background-color: #f5f5f5; }
  .kal-table { table-layout: fixed; border-collapse: collapse; margin-top: 2px; }
  .kal-table th, .kal-table td {
    text-align: center; padding: 1.8px 0; font-size: 6.8pt; border: 0.4px solid #999;
  }
  .kal-table th {
    background-color: #dcdcdc; font-size: 7.4pt; border-bottom: 1.2px solid #000;
    border-left: 1.2px solid #000; border-right: 1.2px solid #000;
  }
  .kal-table .row-lbl {
    font-weight: bold; background-color: #e5e5e5; width: 6.5%;
    border-right: 1.2px solid #000; border-left: 1.2px solid #000;
  }
  .kal-table td.grp-start { border-left: 1.2px solid #000; }
  .kal-table td.grp-end { border-right: 1.2px solid #000; }
  .notes {
    margin-top: 4px; border: 0.75px solid #333; padding: 4px;
    font-size: 6.3pt; line-height: 1.25; background-color: #fafafa;
  }
  .radio-section { font-size: 6.4pt; line-height: 1.15; }
  .radio-section .cat-header { margin-top: 3px; }
  .radio-section table { margin-top: 2px; }
  .radio-section td, .radio-section th { padding: 1px 2px; }
  .radio-assignments td:first-child { font-weight: bold; width: 20%; }
  .radio-channels { font-size: 6pt; }
  .radio-channels td { text-align: center; }
  .radio-note { margin-top: 3px; font-size: 5.8pt; }
  .footer { margin-top: 3px; text-align: center; font-size: 5.8pt; color: #444; }
</style>
</head>
<body>
<div class="controls">
  <label>Days: <input type="number" id="inp-days" value="1" min="1" max="30"></label>
  <label>Start Set #: <input type="number" id="inp-set" value="23" min="1" max="99"></label>
  <label>Seed (optional): <input type="text" id="inp-seed" placeholder="Random"></label>
  <button class="btn-gen" type="button" onclick="renderSheets()">Generate Sheets</button>
  <button class="btn-print" type="button" onclick="window.print()">Print / Save A5 PDF</button>
</div>
<div id="sheets-container"></div>
<script>
const VOCABULARY = {
  "1. NUMERALS & PROCEDURE": [
    "0 (IN GROUP)", "0+ (STANDALONE)", "1 (IN GROUP)", "1+ (STANDALONE)",
    "2 (IN GROUP)", "2+ (STANDALONE)", "3 (IN GROUP)", "3+ (STANDALONE)",
    "4 (IN GROUP)", "4+ (STANDALONE)", "5 (IN GROUP)", "5+ (STANDALONE)",
    "6 (IN GROUP)", "6+ (STANDALONE)", "7 (IN GROUP)", "7+ (STANDALONE)",
    "8 (IN GROUP)", "8+ (STANDALONE)", "9 (IN GROUP)", "9+ (STANDALONE)",
    "NUMERALS (START)", "TEXT (RESUME)", "PERIOD (.)", "SPELL (START/END)"
  ],
  "2. ROAD & VEHICLES": [
    "BREAKDOWN", "BRIDGE", "CLOSED", "DETOUR", "EXIT", "FUEL", "GATE",
    "MECHANIC", "OFF-ROAD", "PARK", "REFILL", "ROAD", "TIRE", "TOW", "VEHICLE"
  ],
  "3. NAVIGATION & LOCATIONS": [
    "ARRIVED", "CAMP", "CANYON", "CHECKPOINT", "CLIMB", "COORDINATES",
    "CROSSING", "DELAYED", "DEPARTED", "EAST", "ELEVATION", "GEAR", "JUNCTION",
    "KILOMETRE", "LAKE", "LEFT", "NORTH", "PASS", "RETURN", "RIDGE", "RIGHT",
    "ROUTE", "SOUTH", "SPRING", "STOP", "SUMMIT", "TRAIL", "TRAILHEAD", "TURN",
    "WATER", "WATERWAY", "WEST"
  ],
  "4. SAFETY, HAZARDS & SEVERE WEATHER": [
    "DANGER", "EMERGENCY", "FIRST AID", "FLOODED", "INJURED", "MISSING", "NIGHT",
    "RANGER", "ROCKSLIDE", "SNAKE", "SNOW", "STORM", "WILDLIFE", "WITHDRAW"
  ],
  "5. RADIO PROCEDURE": [
    "CALL SIGN", "RADIO CHECK", "SWITCH CHANNEL", "SWITCH FREQUENCY",
    "SWITCH TO PRIMARY", "SWITCH TO SECONDARY", "SWITCH TO ALTERNATE"
  ]
};

// Mulberry32-style seeded generator for repeatable sheets.
function createRNG(seedStr) {
  if (!seedStr) return Math.random;
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function() {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}

function shuffle(array, rng) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Generate trigraphs with minimum Hamming distance >= 2.
function generateHammingTrigraphs(count, rng) {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const all = [];
  for (const a of letters) {
    for (const b of letters) {
      for (const c of letters) all.push(a + b + c);
    }
  }
  shuffle(all, rng);
  const selected = [];
  for (const candidate of all) {
    const valid = selected.every(existing => {
      let diff = 0;
      if (candidate[0] !== existing[0]) diff++;
      if (candidate[1] !== existing[1]) diff++;
      if (candidate[2] !== existing[2]) diff++;
      return diff >= 2;
    });
    if (valid) {
      selected.push(candidate);
      if (selected.length === count) return selected;
    }
  }
  throw new Error("Unable to generate enough trigraphs.");
}

// KAL-61 digit slot widths: 4-3-3-2-2-3-2-2-2-2 = 25 slots.
const KAL61_SLOT_WIDTHS = [4, 3, 3, 2, 2, 3, 2, 2, 2, 2];
const ALPHABET_25 = "ABCDEFGHIJKLMNOPQRSTUVWXY".split("");

function generateKAL61Rows(rng) {
  return ALPHABET_25.map(rowLabel => ({
    rowLabel,
    letters: shuffle([...ALPHABET_25], rng)
  }));
}

function buildRadioPage(dayNum, setNum, mapping) {
  const assignments = ["PRIMARY", "SECONDARY", "ALTERNATE 1", "ALTERNATE 2"];
  let assignmentRows = "";
  for (const role of assignments) {
    assignmentRows += `<tr><td>${role}</td><td>&nbsp;</td><td>CH ____</td><td>________ MHz</td></tr>`;
  }

  const switchPhrases = [
    "CALL SIGN", "RADIO CHECK", "SWITCH CHANNEL", "SWITCH FREQUENCY",
    "SWITCH TO PRIMARY", "SWITCH TO SECONDARY", "SWITCH TO ALTERNATE"
  ];
  const switchRows = switchPhrases.map(phrase =>
    `<tr><td>${phrase}</td><td class="c">${mapping[phrase]}</td></tr>`
  ).join("");

  let channelRows = "";
  for (let row = 0; row < 20; row++) {
    const channels = [row + 1, row + 21, row + 41, row + 61];
    channelRows += `<tr>${channels.map(channel => `<td>${String(channel).padStart(2, "0")}</td>`).join("")}</tr>`;
  }

  return `<div class="page radio-section"><div>` +
    `<div class="header"><div class="title">RADIO PLAN &amp; CALL SIGNS</div>` +
    `<div class="meta">DAY ${dayNum} | SET ${setNum} | UHF CB</div></div>` +
    `<div class="cat-header">CALL SIGNS</div>` +
    `<table><tbody><tr><th>YOUR STATION</th><td>&nbsp;</td><th>TEAM / OTHER</th><td>&nbsp;</td></tr></tbody></table>` +
    `<div class="cat-header">PRIMARY / SECONDARY FREQUENCIES &amp; ALTERNATES</div>` +
    `<table class="radio-assignments"><thead><tr><th>ROLE</th><th>CALL SIGN</th><th>CHANNEL</th><th>FREQUENCY</th></tr></thead>` +
    `<tbody>${assignmentRows}</tbody></table>` +
    `<div class="cat-header">RADIO PROCEDURE CODES</div>` +
    `<table><thead><tr><th>MEANING</th><th>CODE</th></tr></thead><tbody>${switchRows}</tbody></table>` +
    `<div class="cat-header">80-CHANNEL UHF CB CHANNEL INDEX</div>` +
    `<table class="radio-channels"><thead><tr><th>CH</th><th>CH</th><th>CH</th><th>CH</th></tr></thead><tbody>${channelRows}</tbody></table>` +
    `<div class="radio-note"><strong>Frequency:</strong> Record the MHz values from the locally approved channel plan and your radio's channel chart; channel-frequency assignments and permitted use depend on jurisdiction and equipment. Follow local restrictions, including emergency and data-only channel rules. UHF CB transmissions are not private or encrypted; these procedure codes are not encryption.</div>` +
    `</div><div class="footer">OVERLAND &amp; TRAIL OPSEC EDITION — DESTROY AFTER USE</div></div>`;
}

function buildDayHTML(dayNum, startSet, rng) {
  const setNum = String(startSet + dayNum - 1).padStart(2, "0");
  const allWords = Object.values(VOCABULARY).flat();
  const trigraphs = generateHammingTrigraphs(allWords.length, rng);
  const mapping = {};
  allWords.forEach((word, index) => { mapping[word] = trigraphs[index]; });

  // Page 1: encode lookup.
  let encodeHTML = "";
  for (const [category, words] of Object.entries(VOCABULARY)) {
    encodeHTML += `<div class="cat-header">${category}</div><table>`;
    const half = Math.ceil(words.length / 2);
    for (let i = 0; i < half; i++) {
      const word1 = words[i];
      const word2 = words[i + half] || "";
      encodeHTML += `<tr><td class="w">${word1}</td><td class="c">${mapping[word1]}</td>` +
        `<td class="w">${word2}</td><td class="c">${word2 ? mapping[word2] : ""}</td></tr>`;
    }
    encodeHTML += "</table>";
  }
  const page1 = `<div class="page"><div><div class="header"><div class="title">KTC-600 OPERATIONS CODE — ENCODE</div>` +
    `<div class="meta">DAY ${dayNum} | SET ${setNum} | 24 HRS</div></div>${encodeHTML}</div>` +
    `<div class="footer">OVERLAND &amp; TRAIL OPSEC EDITION — DESTROY AFTER USE</div></div>`;

  // Page 2: decode lookup, sorted by code.
  const decodePairs = Object.entries(mapping)
    .map(([word, code]) => ({ code, word }))
    .sort((a, b) => a.code.localeCompare(b.code));
  const halfDec = Math.ceil(decodePairs.length / 2);
  let decodeRowsHTML = "";
  for (let i = 0; i < halfDec; i++) {
    const first = decodePairs[i];
    const second = decodePairs[i + halfDec] || { code: "", word: "" };
    decodeRowsHTML += `<tr><td class="c">${first.code}</td><td class="w">${first.word}</td>` +
      `<td class="c">${second.code}</td><td class="w">${second.word}</td></tr>`;
  }
  const page2 = `<div class="page"><div><div class="header"><div class="title">KTC-600 OPERATIONS CODE — DECODE</div>` +
    `<div class="meta">DAY ${dayNum} | SET ${setNum} | ALPHABETICAL</div></div>` +
    `<table><thead><tr><th class="c">CODE</th><th class="w">PLAINTEXT</th>` +
    `<th class="c">CODE</th><th class="w">PLAINTEXT</th></tr></thead><tbody>${decodeRowsHTML}</tbody></table></div>` +
    `<div class="footer">OVERLAND &amp; TRAIL OPSEC EDITION — DESTROY AFTER USE</div></div>`;

  // Page 3: KAL-61 / KTC-1400 frame sheet.
  const headerSpans = KAL61_SLOT_WIDTHS
    .map((span, digit) => `<th colspan="${span}">${digit}</th>`)
    .join("");
  const groupStartIndices = new Set();
  const groupEndIndices = new Set();
  let cursor = 0;
  for (const width of KAL61_SLOT_WIDTHS) {
    groupStartIndices.add(cursor);
    groupEndIndices.add(cursor + width - 1);
    cursor += width;
  }
  const kalRows = generateKAL61Rows(rng);
  const kalBodyHTML = kalRows.map(({ rowLabel, letters }) => {
    const cells = letters.map((character, index) => {
      const classes = [];
      if (groupStartIndices.has(index)) classes.push("grp-start");
      if (groupEndIndices.has(index)) classes.push("grp-end");
      return `<td class="${classes.join(" ")}">${character}</td>`;
    }).join("");
    return `<tr><td class="row-lbl">${rowLabel}</td>${cells}</tr>`;
  }).join("");
  const page3 = `<div class="page"><div><div class="header"><div class="title">KTC-1400 / KAL-61 NUMERAL CIPHER</div>` +
    `<div class="meta">DAY ${dayNum} | SET ${setNum} | LIST ALPHA</div></div>` +
    `<table class="kal-table"><thead><tr><th class="row-lbl"></th>${headerSpans}</tr></thead>` +
    `<tbody>${kalBodyHTML}</tbody></table>` +
    `<div class="notes"><strong>KAL-61 FRAME ALIGNMENT:</strong> Insert sheet so rows A–Y align with the left window and digits 0–9 align with the top column slots (4-3-3-2-2-3-2-2-2-2).<br><br>` +
    `<strong>ENCIPHERMENT:</strong> Pick random start row + indicator letter. Encipher one digit per row stepping down (A→Y→A). Wrap with KTC-600 NUMERALS and TEXT codes.</div></div>` +
    `<div class="footer">OVERLAND &amp; TRAIL OPSEC EDITION — DESTROY AFTER USE</div></div>`;

  return page1 + page2 + page3 + buildRadioPage(dayNum, setNum, mapping);
}

function renderSheets() {
  const days = Math.max(1, Math.min(30, parseInt(document.getElementById("inp-days").value, 10) || 1));
  const startSet = Math.max(1, Math.min(99, parseInt(document.getElementById("inp-set").value, 10) || 23));
  const seedInput = document.getElementById("inp-seed").value.trim();
  const rng = createRNG(seedInput);
  const container = document.getElementById("sheets-container");
  let output = "";
  for (let day = 1; day <= days; day++) output += buildDayHTML(day, startSet, rng);
  container.innerHTML = output;
}

renderSheets();
</script>
</body>
</html>
